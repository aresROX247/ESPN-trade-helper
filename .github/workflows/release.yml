name: Release

# Publishes a GitHub Release with a ready-to-run Windows launcher so users can
# download the .exe from the Releases page instead of setting up Node.js first.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Confirm the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const metadata = require('./package.json'); const tag = process.env.GITHUB_REF_NAME.replace(/^v/, ''); if (metadata.version !== tag) { console.error('package.json is ' + metadata.version + ' but the tag is ' + tag); process.exit(1); } console.log('Tag v' + tag + ' matches package.json.');"

  windows-launcher:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build ESPN Fantasy Importer.exe
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./build-exe.ps1
      - name: Attach the launcher to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ESPN Fantasy Importer.exe
          fail_on_unmatched_files: true
          generate_release_notes: true